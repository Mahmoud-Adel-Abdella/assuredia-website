kind = "web"
previewPath = "/"
title = "Assuredia"
version = "1.0.0"
id = "artifacts/assuredia"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19843

[services.development]
run = "pnpm --filter @workspace/assuredia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/assuredia", "run", "build" ]
publicDir = "artifacts/assuredia/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19843"
BASE_PATH = "/"
